<style>
:root{--terra:#241e19;--terra2:#35261d;--creme:#fff5e5;--sec:#d2bea3;--rust:#a9442c;--gold:#e6a43d}
*{box-sizing:border-box}html,body{min-height:100%}
body{margin:0;background:var(--terra);color:var(--creme);font-family:"DM Sans","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:calc(36px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:calc(8px + env(safe-area-inset-top,0px));background:repeating-linear-gradient(90deg,var(--rust) 0 14px,var(--gold) 14px 20px)}
main{width:min(440px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
img.logo{width:104px;height:104px}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.6rem,12vw,3.2rem);line-height:.9;margin:4px 0 0}
h1 span{color:var(--gold)}
.tag{color:var(--sec);margin:0;font-size:.95rem;max-width:34ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;background:var(--rust);color:var(--creme);border:2px solid var(--gold);box-shadow:4px 4px 0 #0d0b09;text-decoration:none;font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn.sec{background:transparent;box-shadow:none;border-color:var(--sec);text-transform:none;letter-spacing:0;font-size:.95rem;min-height:46px}
.btn.sec:hover{border-color:var(--gold)}
.how{width:100%;background:var(--terra2);border:2px solid #4a3a2c;padding:12px 14px;text-align:left;font-size:.88rem;color:var(--sec);line-height:1.5}
.how b{color:var(--creme)}
.how p{margin:4px 0}
.need{display:flex;flex-direction:column;gap:10px;border-color:var(--gold)}
.need .btn.sec{min-height:44px}
[hidden]{display:none!important}
@media (max-width:420px){img.logo{width:92px;height:92px}main{gap:12px}}
</style>

<body>
<main>
<img class="logo" src="icon-512.png" alt="">
<h1>Repasse <span>Salto</span></h1>
<p class="tag">Divisão da taxa de atendimento entre os colaboradores do Salto das Nuvens.</p>
<div class="how need"><p><b>Antes de abrir:</b> o Repasse funciona dentro do Claude. Entre no Claude com a conta que tem acesso ao painel. Não precisa instalar nada, ele abre no próprio navegador.</p><a class="btn sec" href="https://claude.ai/login" target="_blank" rel="noopener">Entrar no Claude</a></div>
<a class="btn" href="https://claude.ai/artifact/Apcmmq6sMFAaTLux9HsRCy">Abrir o Repasse</a>
<button class="btn sec" id="inst" type="button" hidden>Instalar o Repasse neste aparelho</button>
<div class="how" id="how"></div>
</main>
<script>
var ua=navigator.userAgent,isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isAndroid=/Android/.test(ua);
document.getElementById('how').innerHTML=isIOS?'<p><b>Para ter o ícone no iPhone:</b> no Safari, toque em Compartilhar e depois em <b>Adicionar à Tela de Início</b>.</p>'
:isAndroid?'<p><b>Para ter o ícone no Android:</b> no Chrome, toque em ⋮ e depois em <b>Adicionar à tela inicial</b> → <b>Instalar</b>.</p>'
:'<p><b>Para ter o ícone no computador:</b> clique em <b>Instalar o Repasse neste aparelho</b> ou no ícone de instalar na barra de endereço do Chrome ou do Edge.</p><p>Depois de instalado, ele abre numa janela própria, como um programa, e o ícone fica na área de trabalho.</p>';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
var ev=null,b=document.getElementById('inst');
addEventListener('beforeinstallprompt',function(e){e.preventDefault();ev=e;b.hidden=false});
b.onclick=function(){if(!ev)return;ev.prompt();ev.userChoice.then(function(){b.hidden=true})};
addEventListener('appinstalled',function(){b.hidden=true});
</script>
</body>
